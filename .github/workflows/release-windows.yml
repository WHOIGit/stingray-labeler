name: Build and publish Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Confirm tag matches package version
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Release tag $env:GITHUB_REF_NAME does not match pyproject.toml version v$version"
          }

      - name: Install package and Windows build tools
        run: python -m pip install ".[build]"

      - name: Build Windows executable
        run: python -m PyInstaller --clean --noconfirm pyinstaller.spec

      - name: Publish GitHub Release with executable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $releaseTag = $env:GITHUB_REF_NAME
          $exe = "dist/StingrayLabeler-$($releaseTag.Substring(1)).exe"
          # The exe bundles Qt/PySide6 (LGPL-3.0): ship the licences and notices alongside it.
          $files = @($exe, "LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/LGPL-3.0.txt", "licenses/GPL-3.0.txt")
          gh release view $releaseTag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $releaseTag @files --clobber
          } else {
            gh release create $releaseTag @files --verify-tag --generate-notes --title "Stingray Labeler $releaseTag"
          }
