name: Build and publish Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Confirm tag matches package version
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Release tag $env:GITHUB_REF_NAME does not match pyproject.toml version v$version"
          }

      - name: Install package and Windows build tools
        run: python -m pip install ".[build]"

      - name: Build Windows executable
        run: python -m PyInstaller --clean --noconfirm pyinstaller.spec

      - name: Publish GitHub Release with executable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$env:GITHUB_REF_NAME" "dist/StingrayLabeler.exe" --verify-tag --generate-notes --title "Stingray Labeler $env:GITHUB_REF_NAME"
