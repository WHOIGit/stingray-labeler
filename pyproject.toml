[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stingray-labeler"
version = "0.1.3"
description = "Lightweight local COCO image annotation tool for the Stingray custom tow sled"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "Pillow>=9.0",
    "PySide6>=6.5",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]

[project.scripts]
stingray-labeler = "stingray_labeler.app:main"

[project.gui-scripts]
stingray-labeler-gui = "stingray_labeler.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stingray_labeler = ["assets/*.png", "assets/*.ico", "assets/*.md"]
